# Configuration template for scripts/rotor_control.py
# Copy to scripts/rotor_config.ini (next to rotor_control.py) and fill in.
# rotor_config.ini is excluded from the repository (.gitignore): never share it.
# Environment variables take precedence: ROTOR_PORT, ROTOR_QRZ_USER, ROTOR_QRZ_PASS, ROTOR_QRZ_KEY.

[serie]
# Linux: stable path, see "ls -l /dev/serial/by-id/". Empty = no connection.
port =
baud = 9600

[station]
# your latitude/longitude (decimal degrees, North and East positive)
lat = 0.0
lon = 0.0

[qrz]
user =
password =
key =
